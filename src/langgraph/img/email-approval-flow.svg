<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <!-- 节点渐变 -->
    <linearGradient id="gStart" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/></linearGradient>
    <linearGradient id="gNode" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00f2fe"/></linearGradient>
    <linearGradient id="gWait" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f093fb"/><stop offset="100%" stop-color="#f5576c"/></linearGradient>
    <linearGradient id="gSend" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#43e97b"/><stop offset="100%" stop-color="#38f9d7"/></linearGradient>
    <linearGradient id="gCancel" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a8a8a8"/><stop offset="100%" stop-color="#7a7a7a"/></linearGradient>
    <linearGradient id="gEnd" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fc5c7d"/><stop offset="100%" stop-color="#6a82fb"/></linearGradient>
    <linearGradient id="gHuman" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff9a44"/><stop offset="100%" stop-color="#fc6076"/></linearGradient>
    <linearGradient id="gExternal" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a18cd1"/><stop offset="100%" stop-color="#fbc2eb"/></linearGradient>

    <!-- 阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#0003"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0002"/>
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4facfe"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#43e97b"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f5576c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>

    <style>
      text { user-select: none; }
    </style>
  </defs>

  <!-- ============================================================ -->
  <!-- 背景 -->
  <!-- ============================================================ -->
  <rect width="1100" height="900" fill="#f8f9fd" rx="12"/>

  <!-- 标题 -->
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2d3748">邮件审批工作流 · Human-in-the-Loop（HITL）</text>
  <text x="550" y="58" text-anchor="middle" font-size="12" fill="#718096">Email Approval Workflow — Draft → Review → Send / Cancel / Revise</text>

  <!-- ============================================================ -->
  <!-- 左侧：节点流程 -->
  <!-- ============================================================ -->

  <!-- 区域标签 -->
  <rect x="40" y="72" width="520" height="26" rx="6" fill="#ebf4ff" stroke="#a3bffa" stroke-width="0.5"/>
  <text x="52" y="90" font-size="12" fill="#4a6fa5" font-weight="bold">📐 LangGraph 工作流节点拓扑</text>

  <!-- ============================================================ -->
  <!-- 0. 外部触发 (入口) -->
  <!-- ============================================================ -->
  <rect x="240" y="108" width="120" height="34" rx="17" fill="url(#gExternal)" filter="url(#shadowLight)"/>
  <text x="300" y="130" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">外部调用 start()</text>

  <!-- 箭头: 外部触发 → START -->
  <line x1="300" y1="142" x2="300" y2="175" stroke="#a18cd1" stroke-width="1.5" marker-end="url(#arrowPurple)" stroke-dasharray="4,2"/>

  <!-- ============================================================ -->
  <!-- 1. START -->
  <!-- ============================================================ -->
  <rect x="260" y="178" width="80" height="38" rx="19" fill="url(#gStart)" filter="url(#shadow)"/>
  <text x="300" y="202" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">START</text>

  <!-- 箭头: START → draftNode -->
  <line x1="300" y1="216" x2="300" y2="255" stroke="#4facfe" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- ============================================================ -->
  <!-- 2. draftNode -->
  <!-- ============================================================ -->
  <rect x="200" y="258" width="200" height="58" rx="10" fill="url(#gNode)" filter="url(#shadow)"/>
  <text x="300" y="280" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">✍️  draftNode</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#fff" opacity="0.9">LLM 起草邮件草稿</text>

  <!-- ============================================================ -->
  <!-- State 数据流标注（draftNode 右侧） -->
  <!-- ============================================================ -->
  <rect x="420" y="250" width="135" height="72" rx="6" fill="#fff" stroke="#4facfe" stroke-width="1" opacity="0.85"/>
  <text x="487" y="268" text-anchor="middle" font-size="9" fill="#4a6fa5" font-weight="bold">→ 写入 State</text>
  <text x="434" y="284" font-size="9" fill="#555">draftEmail: {...}</text>
  <text x="434" y="298" font-size="9" fill="#555">approvalStatus: pending</text>
  <text x="434" y="312" font-size="9" fill="#555">revisionCount: +1</text>

  <!-- 箭头: draftNode → waitNode -->
  <line x1="300" y1="316" x2="300" y2="365" stroke="#f5576c" stroke-width="1.8" marker-end="url(#arrowPink)"/>

  <!-- ============================================================ -->
  <!-- 3. waitNode -->
  <!-- ============================================================ -->
  <rect x="200" y="368" width="200" height="58" rx="10" fill="url(#gWait)" filter="url(#shadow)"/>
  <text x="300" y="390" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">⏸️  waitNode</text>
  <text x="300" y="410" text-anchor="middle" font-size="10" fill="#fff" opacity="0.9">interrupt() 暂停，等待人工审批</text>

  <!-- interrupt 机制标注 -->
  <rect x="420" y="360" width="135" height="72" rx="6" fill="#fff" stroke="#f5576c" stroke-width="1" opacity="0.85"/>
  <text x="487" y="378" text-anchor="middle" font-size="9" fill="#e53e3e" font-weight="bold">⏸ interrupt 挂起</text>
  <text x="434" y="394" font-size="9" fill="#555">type: email_review</text>
  <text x="434" y="408" font-size="9" fill="#555">draft: {...}</text>
  <text x="434" y="422" font-size="9" fill="#555">options: 批准/拒绝/修改</text>

  <!-- ============================================================ -->
  <!-- 条件路由标注 -->
  <!-- ============================================================ -->
  <rect x="230" y="435" width="140" height="22" rx="5" fill="#fef3c7" stroke="#d68a1a" stroke-width="0.5"/>
  <text x="300" y="450" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">🔀 addConditionalEdges</text>

  <!-- 菱形路由节点 -->
  <polygon points="300,470 330,497 300,524 270,497" fill="#fef3c7" stroke="#d68a1a" stroke-width="1.5"/>
  <text x="300" y="500" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">路由</text>

  <!-- ============================================================ -->
  <!-- 三个分支 -->
  <!-- ============================================================ -->

  <!-- 审批批准 → sendNode -->
  <line x1="330" y1="497" x2="500" y2="497" stroke="#43e97b" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="415" y="490" text-anchor="middle" font-size="9" fill="#38a169" font-weight="bold">approved</text>

  <!-- 拒绝 → cancelNode -->
  <line x1="300" y1="524" x2="300" y2="610" stroke="#888" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <text x="312" y="570" font-size="9" fill="#666" font-weight="bold">rejected</text>

  <!-- 需要修改 → 回到 draftNode (循环) -->
  <path d="M 270 497 Q 120 497 120 400 Q 120 287 195 287" stroke="#f5576c" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowPink)"/>
  <text x="105" y="398" text-anchor="middle" font-size="9" fill="#e53e3e" font-weight="bold">need_modify</text>
  <text x="105" y="412" text-anchor="middle" font-size="8" fill="#999">循环修订</text>

  <!-- ============================================================ -->
  <!-- 4. sendNode -->
  <!-- ============================================================ -->
  <rect x="505" y="472" width="155" height="50" rx="10" fill="url(#gSend)" filter="url(#shadow)"/>
  <text x="583" y="493" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">📤  sendNode</text>
  <text x="583" y="511" text-anchor="middle" font-size="10" fill="#fff" opacity="0.9">发送邮件 → END</text>

  <!-- ============================================================ -->
  <!-- 5. cancelNode -->
  <!-- ============================================================ -->
  <rect x="220" y="612" width="160" height="50" rx="10" fill="url(#gCancel)" filter="url(#shadow)"/>
  <text x="300" y="633" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">🚫  cancelNode</text>
  <text x="300" y="651" text-anchor="middle" font-size="10" fill="#fff" opacity="0.9">取消发送 → END</text>

  <!-- ============================================================ -->
  <!-- 6. END -->
  <!-- ============================================================ -->
  <!-- sendNode → END -->
  <rect x="605" y="548" width="80" height="34" rx="17" fill="url(#gEnd)" filter="url(#shadow)"/>
  <text x="645" y="570" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">END</text>
  <line x1="583" y1="522" x2="583" y2="548" stroke="#43e97b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="583" y1="548" x2="605" y2="565" stroke="#43e97b" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- cancelNode → END -->
  <line x1="300" y1="662" x2="300" y2="690" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <rect x="260" y="692" width="80" height="34" rx="17" fill="url(#gEnd)" filter="url(#shadow)"/>
  <text x="300" y="714" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">END</text>

  <!-- ============================================================ -->
  <!-- 右侧：HITL 机制 & 外部 API 说明 -->
  <!-- ============================================================ -->

  <!-- 区域标题 -->
  <rect x="600" y="72" width="470" height="26" rx="6" fill="#fef3c7" stroke="#d68a1a" stroke-width="0.5"/>
  <text x="612" y="90" font-size="12" fill="#92400e" font-weight="bold">👤 Human-in-the-Loop 人机交互机制</text>

  <!-- ============================================================ -->
  <!-- 人工审批角色 -->
  <!-- ============================================================ -->
  <rect x="620" y="108" width="430" height="100" rx="8" fill="#fff" stroke="#f5576c" stroke-width="1" filter="url(#shadowLight)"/>
  <circle cx="648" cy="132" r="14" fill="url(#gHuman)"/>
  <text x="648" y="137" text-anchor="middle" font-size="12" fill="#fff">👤</text>
  <text x="670" y="136" font-size="13" font-weight="bold" fill="#e53e3e">审批人（人工决策者）</text>

  <text x="640" y="158" font-size="11" fill="#555">收到 interrupt 信号后，审批人审查草稿，做出三种选择之一：</text>
  <rect x="640" y="167" width="55" height="20" rx="4" fill="#43e97b" opacity="0.2"/>
  <text x="667" y="181" text-anchor="middle" font-size="10" fill="#38a169" font-weight="bold">批准</text>
  <rect x="702" y="167" width="55" height="20" rx="4" fill="#f5576c" opacity="0.15"/>
  <text x="729" y="181" text-anchor="middle" font-size="10" fill="#e53e3e" font-weight="bold">拒绝</text>
  <rect x="764" y="167" width="55" height="20" rx="4" fill="#a18cd1" opacity="0.2"/>
  <text x="791" y="181" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="bold">修改</text>

  <!-- ============================================================ -->
  <!-- interrupt / resume 机制详解 -->
  <!-- ============================================================ -->
  <rect x="620" y="220" width="430" height="195" rx="8" fill="#fff" stroke="#a18cd1" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="640" y="244" font-size="13" font-weight="bold" fill="#7c3aed">🔄 interrupt() / Command.resume() 机制</text>

  <!-- Step 1 -->
  <rect x="640" y="255" width="12" height="12" rx="2" fill="#f5576c"/>
  <text x="658" y="265" font-size="11" fill="#333" font-weight="bold">Step 1 — 挂起</text>
  <text x="658" y="282" font-size="10" fill="#666">interrupt({ type, message, draft, options })</text>
  <text x="658" y="297" font-size="10" fill="#999">→ 工作流暂停，state 存入 MemorySaver</text>

  <!-- Step 2 -->
  <rect x="640" y="310" width="12" height="12" rx="2" fill="#a18cd1"/>
  <text x="658" y="320" font-size="11" fill="#333" font-weight="bold">Step 2 — 传递审批数据</text>
  <text x="658" y="337" font-size="10" fill="#666">graph.invoke() 返回 { __interrupt__: [{ value: {draft, options} }] }</text>
  <text x="658" y="352" font-size="10" fill="#999">→ start() 提取 reviewData 返回给前端展示</text>

  <!-- Step 3 -->
  <rect x="640" y="365" width="12" height="12" rx="2" fill="#43e97b"/>
  <text x="658" y="375" font-size="11" fill="#333" font-weight="bold">Step 3 — 恢复执行</text>
  <text x="658" y="392" font-size="10" fill="#666">Command({ resume: 'approved' }) / 'rejected' / {action:'modify',feedback}</text>
  <text x="658" y="407" font-size="10" fill="#999">→ interrupt() 返回 resume 的值，工作流继续</text>

  <!-- ============================================================ -->
  <!-- 外部 API 接口 -->
  <!-- ============================================================ -->
  <rect x="620" y="426" width="430" height="145" rx="8" fill="#fff" stroke="#4facfe" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="640" y="450" font-size="13" font-weight="bold" fill="#3182ce">🌐 对外 API 接口</text>

  <!-- API 1 -->
  <rect x="640" y="460" width="190" height="32" rx="5" fill="#ebf8ff" stroke="#90cdf4" stroke-width="0.5"/>
  <text x="652" y="480" font-size="11" fill="#2b6cb0" font-weight="bold">POST /email/start</text>
  <text x="775" y="480" font-size="10" fill="#4a6fa5">{ emailRequest, threadId }</text>

  <!-- API 2 -->
  <rect x="640" y="498" width="190" height="32" rx="5" fill="#f0fff4" stroke="#9ae6b4" stroke-width="0.5"/>
  <text x="652" y="518" font-size="11" fill="#276749" font-weight="bold">POST /email/approve</text>
  <text x="775" y="518" font-size="10" fill="#38a169">{ threadId }</text>

  <!-- API 3 -->
  <rect x="640" y="536" width="190" height="32" rx="5" fill="#fff5f5" stroke="#feb2b2" stroke-width="0.5"/>
  <text x="652" y="556" font-size="11" fill="#9b2c2c" font-weight="bold">POST /email/reject</text>
  <text x="775" y="556" font-size="10" fill="#e53e3e">{ threadId }</text>

  <!-- ============================================================ -->
  <!-- 三个分支的详细结果 -->
  <!-- ============================================================ -->
  <rect x="620" y="582" width="430" height="155" rx="8" fill="#fff" stroke="#43e97b" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="640" y="606" font-size="13" font-weight="bold" fill="#38a169">📋 三种审批结果的走向</text>

  <!-- 批准 -->
  <rect x="640" y="616" width="390" height="35" rx="5" fill="#f0fff4" stroke="#9ae6b4" stroke-width="0.5"/>
  <text x="652" y="632" font-size="10" fill="#276749" font-weight="bold">✅ 批准 (approved)</text>
  <text x="770" y="632" font-size="10" fill="#444">→ sendNode → 发送邮件到 {draftEmail.recipient} → END</text>
  <text x="652" y="646" font-size="9" fill="#999">decision = 'approved'  ·  finalStatus = "✅ 邮件已发送..."</text>

  <!-- 拒绝 -->
  <rect x="640" y="656" width="390" height="35" rx="5" fill="#fff5f5" stroke="#feb2b2" stroke-width="0.5"/>
  <text x="652" y="672" font-size="10" fill="#9b2c2c" font-weight="bold">❌ 拒绝 (rejected)</text>
  <text x="770" y="672" font-size="10" fill="#444">→ cancelNode → 记录取消原因 → END</text>
  <text x="652" y="686" font-size="9" fill="#999">decision = 'rejected'  ·  finalStatus = "❌ 邮件已取消..."</text>

  <!-- 修改 -->
  <rect x="640" y="696" width="390" height="35" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="0.5"/>
  <text x="652" y="712" font-size="10" fill="#6b21a8" font-weight="bold">✏️ 需要修改 (need_modify)</text>
  <text x="780" y="712" font-size="10" fill="#444">→ 回到 draftNode 重写 → waitNode 再次挂起审批</text>
  <text x="652" y="726" font-size="9" fill="#999">decision = { action: 'modify', feedback: '...' }  ·  修改次数 +1  ·  无限循环直到批准/拒绝</text>

  <!-- ============================================================ -->
  <!-- 核心概念 -->
  <!-- ============================================================ -->
  <rect x="620" y="748" width="430" height="135" rx="8" fill="#fff" stroke="#d68a1a" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="640" y="772" font-size="13" font-weight="bold" fill="#92400e">💡 核心技术点</text>

  <text x="640" y="796" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#d68a1a">① threadId 多实例隔离</tspan>
    <tspan fill="#888">— 每个审批请求独立线程，MemorySaver 按 thread_id 存取</tspan>
  </text>
  <text x="640" y="816" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#d68a1a">② State 累加 reducer</tspan>
    <tspan fill="#888">— revisionCount 使用 (prev,curr)=&gt;prev+curr，每次修改自动累加</tspan>
  </text>
  <text x="640" y="836" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#d68a1a">③ 修改循环无退出条件</tspan>
    <tspan fill="#888">— 审批人可反复修改 N 次，直到批准或拒绝才退出循环</tspan>
  </text>
  <text x="640" y="856" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#d68a1a">④ 编译时注入 checkpointer</tspan>
    <tspan fill="#888">— compile({ checkpointer: new MemorySaver() }) 实现 interrupt 状态持久化</tspan>
  </text>
  <text x="640" y="876" font-size="10" fill="#999">
    <tspan fill="#e53e3e">⚠ 注意：MemorySaver 基于内存，服务重启后所有审批状态丢失（生产环境需换 SqliteSaver）</tspan>
  </text>

</svg>
