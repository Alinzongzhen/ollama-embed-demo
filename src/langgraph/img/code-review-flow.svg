<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c5ce7"/>
    </marker>
    <marker id="arrowM" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9c27b0"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11998e"/><stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="startGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43e97b"/><stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="endGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f093fb"/><stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="dispatchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="1200" height="56" fill="url(#headerGrad)"/>
  <text x="600" y="36" text-anchor="middle" fill="white" font-size="22" font-weight="bold">CodeReviewService · Map-Reduce 三路并行审查工作流</text>

  <!-- ========== 入口 ========== -->
  <rect x="440" y="78" width="320" height="44" rx="22" fill="#eceff1" stroke="#90a4ae" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="105" text-anchor="middle" fill="#37474f" font-size="14" font-weight="bold">review(code, language) → graph.invoke()</text>

  <line x1="600" y1="122" x2="600" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- START 节点 -->
  <ellipse cx="600" cy="175" rx="40" ry="20" fill="url(#startGrad)" filter="url(#shadow)"/>
  <text x="600" y="181" text-anchor="middle" fill="white" font-size="14" font-weight="bold">START</text>

  <line x1="600" y1="195" x2="600" y2="228" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== dispatch 节点 ========== -->
  <rect x="360" y="233" width="480" height="90" rx="12" fill="#fff5f5" stroke="#ff6b6b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="233" width="480" height="34" rx="12" fill="url(#dispatchGrad)"/>
  <rect x="360" y="258" width="480" height="4" fill="url(#dispatchGrad)"/>
  <text x="600" y="257" text-anchor="middle" fill="white" font-size="15" font-weight="bold">dispatch · 分发节点（Command + Send API）</text>

  <text x="600" y="285" text-anchor="middle" fill="#c0392b" font-size="12">创建 3 个审查维度任务，各自携带独立 SingleReviewState 副本</text>
  <text x="600" y="305" text-anchor="middle" fill="#c0392b" font-size="12">tasks = [安全性, 性能, 代码规范] → 3 × Send('reviewAgent', {code, language, aspect, prompt})</text>
  <text x="600" y="318" text-anchor="middle" fill="#888" font-size="10">fan-out: 三路并行派发，不等待</text>

  <!-- 三路分叉线 -->
  <line x1="600" y1="323" x2="600" y2="350" stroke="#555" stroke-width="2"/>
  <line x1="210" y1="350" x2="990" y2="350" stroke="#555" stroke-width="2"/>
  <line x1="210" y1="350" x2="210" y2="375" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="350" x2="600" y2="375" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="350" x2="990" y2="375" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== 3 个并行 reviewAgent ========== -->

  <!-- 安全性 -->
  <rect x="70" y="380" width="280" height="150" rx="12" fill="#f0f0ff" stroke="#6c5ce7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="380" width="280" height="34" rx="12" fill="#6c5ce7"/>
  <rect x="70" y="408" width="280" height="4" fill="#6c5ce7"/>
  <text x="210" y="404" text-anchor="middle" fill="white" font-size="14" font-weight="bold">reviewAgent #1 · 安全性</text>

  <text x="90" y="432" fill="#333" font-size="11">💬 prompt:</text>
  <text x="90" y="450" fill="#555" font-size="10">检查 SQL 注入、XSS、敏感信息泄露</text>
  <text x="90" y="468" fill="#333" font-size="11">📥 state: code + aspect="安全性"</text>
  <text x="90" y="486" fill="#333" font-size="11">🔧 llm.invoke → JSON.parse</text>
  <text x="90" y="504" fill="#333" font-size="11">📤 追加到 reviewResults[]</text>
  <rect x="90" y="512" width="240" height="10" rx="5" fill="#e8e0ff"/>
  <rect x="90" y="512" width="180" height="10" rx="5" fill="#6c5ce7"/>
  <text x="220" y="521" text-anchor="middle" fill="white" font-size="8">⏳ 并行执行中...</text>

  <!-- 性能 -->
  <rect x="460" y="380" width="280" height="150" rx="12" fill="#f0f0ff" stroke="#6c5ce7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="380" width="280" height="34" rx="12" fill="#6c5ce7"/>
  <rect x="460" y="408" width="280" height="4" fill="#6c5ce7"/>
  <text x="600" y="404" text-anchor="middle" fill="white" font-size="14" font-weight="bold">reviewAgent #2 · 性能</text>

  <text x="480" y="432" fill="#333" font-size="11">💬 prompt:</text>
  <text x="480" y="450" fill="#555" font-size="10">检查算法复杂度、N+1 查询、内存泄漏</text>
  <text x="480" y="468" fill="#333" font-size="11">📥 state: code + aspect="性能"</text>
  <text x="480" y="486" fill="#333" font-size="11">🔧 llm.invoke → JSON.parse</text>
  <text x="480" y="504" fill="#333" font-size="11">📤 追加到 reviewResults[]</text>
  <rect x="480" y="512" width="240" height="10" rx="5" fill="#e8e0ff"/>
  <rect x="480" y="512" width="200" height="10" rx="5" fill="#6c5ce7"/>
  <text x="610" y="521" text-anchor="middle" fill="white" font-size="8">⏳ 并行执行中...</text>

  <!-- 代码规范 -->
  <rect x="850" y="380" width="280" height="150" rx="12" fill="#f0f0ff" stroke="#6c5ce7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="850" y="380" width="280" height="34" rx="12" fill="#6c5ce7"/>
  <rect x="850" y="408" width="280" height="4" fill="#6c5ce7"/>
  <text x="990" y="404" text-anchor="middle" fill="white" font-size="14" font-weight="bold">reviewAgent #3 · 代码规范</text>

  <text x="870" y="432" fill="#333" font-size="11">💬 prompt:</text>
  <text x="870" y="450" fill="#555" font-size="10">检查命名、注释、DRY 原则、错误处理</text>
  <text x="870" y="468" fill="#333" font-size="11">📥 state: code + aspect="代码规范"</text>
  <text x="870" y="486" fill="#333" font-size="11">🔧 llm.invoke → JSON.parse</text>
  <text x="870" y="504" fill="#333" font-size="11">📤 追加到 reviewResults[]</text>
  <rect x="870" y="512" width="240" height="10" rx="5" fill="#e8e0ff"/>
  <rect x="870" y="512" width="160" height="10" rx="5" fill="#6c5ce7"/>
  <text x="1000" y="521" text-anchor="middle" fill="white" font-size="8">⏳ 并行执行中...</text>

  <!-- 三路汇聚线 -->
  <line x1="210" y1="530" x2="210" y2="555" stroke="#555" stroke-width="2"/>
  <line x1="600" y1="530" x2="600" y2="555" stroke="#555" stroke-width="2"/>
  <line x1="990" y1="530" x2="990" y2="555" stroke="#555" stroke-width="2"/>
  <line x1="210" y1="555" x2="990" y2="555" stroke="#555" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="600" y1="555" x2="600" y2="580" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="573" text-anchor="middle" fill="#555" font-size="10">等待 3 路全部完成（barrier sync）</text>

  <!-- ========== generateReport 节点 ========== -->
  <rect x="360" y="588" width="480" height="65" rx="12" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="588" width="480" height="34" rx="12" fill="#9c27b0"/>
  <rect x="360" y="616" width="480" height="4" fill="#9c27b0"/>
  <text x="600" y="612" text-anchor="middle" fill="white" font-size="15" font-weight="bold">generateReport · 汇总节点（Map-Reduce 的 Reduce 阶段）</text>

  <text x="600" y="638" text-anchor="middle" fill="#6a1b9a" font-size="12">计算 avgScore → 拼接三个维度 detail → llm.invoke 生成综合报告</text>

  <line x1="600" y1="653" x2="600" y2="680" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- END 节点 -->
  <ellipse cx="600" cy="700" rx="40" ry="20" fill="url(#endGrad)" filter="url(#shadow)"/>
  <text x="600" y="706" text-anchor="middle" fill="white" font-size="14" font-weight="bold">END</text>

  <!-- ========== 左侧：State 设计 ========== -->
  <rect x="15" y="78" width="340" height="270" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="185" y="100" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">📦 ReviewState（顶层全局）</text>
  <line x1="35" y1="110" x2="335" y2="110" stroke="#ddd" stroke-width="1"/>

  <text x="35" y="133" fill="#6c5ce7" font-size="11" font-weight="bold">code</text>
  <text x="190" y="133" fill="#888" font-size="10">string（只读输入）</text>

  <text x="35" y="156" fill="#e67e22" font-size="11" font-weight="bold">language</text>
  <text x="190" y="156" fill="#888" font-size="10">string（只读输入）</text>

  <text x="35" y="179" fill="#e74c3c" font-size="11" font-weight="bold">reviewResults[]</text>
  <text x="190" y="179" fill="#888" font-size="10">reducer: 累加追加</text>
  <text x="190" y="195" fill="#c0392b" font-size="9">[{aspect, issues[], score}]</text>

  <text x="35" y="218" fill="#9c27b0" font-size="11" font-weight="bold">report</text>
  <text x="190" y="218" fill="#888" font-size="10">string（汇总节点写入）</text>

  <line x1="35" y1="235" x2="335" y2="235" stroke="#ddd" stroke-width="1"/>
  <text x="185" y="252" text-anchor="middle" fill="#6c5ce7" font-size="12" font-weight="bold">SingleReviewState（每个审查实例）</text>
  <text x="35" y="275" fill="#555" font-size="10">code + language + aspect + prompt</text>
  <text x="35" y="293" fill="#888" font-size="10">← dispatch 通过 Send API 注入</text>
  <text x="35" y="311" fill="#888" font-size="10">→ reviewAgent 写入 reviewResults 回顶层</text>

  <rect x="35" y="320" width="300" height="20" rx="4" fill="#e8f5e9"/>
  <text x="185" y="335" text-anchor="middle" fill="#2e7d32" font-size="10">子状态通过 Command + Send 传递</text>

  <!-- ========== 右侧：工作流总结 ========== -->
  <rect x="1040" y="78" width="145" height="270" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="1112" y="100" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">🔀 工作流特征</text>
  <line x1="1055" y1="110" x2="1170" y2="110" stroke="#ddd" stroke-width="1"/>

  <text x="1055" y="133" fill="#555" font-size="10" font-weight="bold">📐 模式</text>
  <text x="1055" y="150" fill="#6c5ce7" font-size="10">Map-Reduce</text>

  <text x="1055" y="173" fill="#555" font-size="10" font-weight="bold">🔀 分发</text>
  <text x="1055" y="190" fill="#e74c3c" font-size="10">Command + Send API</text>
  <text x="1055" y="205" fill="#888" font-size="9">3 路 fan-out</text>

  <text x="1055" y="228" fill="#555" font-size="10" font-weight="bold">⏱️ 并行</text>
  <text x="1055" y="245" fill="#e74c3c" font-size="10">3 个 LLM 调用</text>
  <text x="1055" y="260" fill="#888" font-size="9">同时进行</text>

  <text x="1055" y="283" fill="#555" font-size="10" font-weight="bold">🔗 同步</text>
  <text x="1055" y="300" fill="#9c27b0" font-size="10">barrier 等待</text>
  <text x="1055" y="315" fill="#888" font-size="9">全完成才进汇总</text>
</svg>
